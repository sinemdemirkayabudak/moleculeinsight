[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.2"

hooks = [
  { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },
  { id = "ruff-format", types_or = ["python", "pyi"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "ty", name = "ty", entry = "ty check", language = "system", types = ["python"], pass_filenames = false },
  { id = "pytest", name = "pytest", entry = "pytest", language = "system", types = ["python"], pass_filenames = false, stages = ["commit"] },
]