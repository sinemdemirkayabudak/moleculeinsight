# Streamlit Configuration for Community Cloud Deployment
# Updated for production: 2026-04-07

[theme]
base = "light"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[server]
headless = true
runOnSave = false
port = 8501
maxUploadSize = 10
maxMessageSize = 200

[logger]
level = "info"

[browser]
gatherUsageStats = false